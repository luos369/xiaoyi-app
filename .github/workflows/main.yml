name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet and Deps
        run: |
          pip install flet edge-tts

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 🌟 关键步骤：自动接受安卓协议
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      # 🌟 关键修改：--project 必须使用英文/下划线作为内部标识符
      # APP 的显示名称可以在代码中设置 page.title
      - name: Build APK
        run: |
          flet build apk --project xiaoyi_reader

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyi-reader-apk
          path: build/apk/*.apk
