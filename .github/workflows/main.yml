name: Build Flet APK

on:
  push:
    branches: [ main ] # 当你向 main 分支推送代码时触发
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet and Deps
        run: |
          pip install flet edge-tts

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x' # 自动使用最新的 Flutter 3

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          flet build apk --project "晓依听书"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyi-reader-apk
          path: build/apk/*.apk
