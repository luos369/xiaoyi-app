name: Build Flet APK

on:
  workflow_dispatch: # 允许我们手动点击按钮触发打包

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新的云端 Linux 服务器
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17 环境 (安卓编译必需)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Flet 及所需依赖库
        run: |
          pip install flet
          pip install -r requirements.txt

      - name: 开始编译打包 APK (耗时约 5-10 分钟)
        run: flet build apk

      - name: 上传最终的 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: Xiaoyi-Reader-App
          path: build/apk/**/*.apk
