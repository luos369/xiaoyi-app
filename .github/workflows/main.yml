name: Build Flet APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境 (安卓打包必备)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Flet 和依赖库
        run: |
          pip install flet
          pip install -r requirements.txt

      - name: 开始编译打包 APK (自动按Y确认下载)
        run: yes | flet build apk

      - name: 收集编译好的安装包
        uses: actions/upload-artifact@v4
        with:
          name: Xiaoyi-Reader-App
          path: build/apk/**/*.apk
